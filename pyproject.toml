[project]
name = "llm-council-for-trae"
version = "1.1.0"
description = "A traecli-backed LLM council CLI — multi-model deliberation with HTML export."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llm-council-for-trae = "llm_council_for_trae.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
